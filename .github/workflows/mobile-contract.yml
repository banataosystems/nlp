name: WorldStage mobile contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [redesign/mobile-first-v2]

permissions:
  contents: write

concurrency:
  group: worldstage-mobile-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  mobile-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx http-server . -p 4173 -c-1 > /tmp/worldstage-http.log 2>&1 &
      - run: npx wait-on http://127.0.0.1:4173
      - run: npm run test:mobile
      - run: npm run test:phase3
      - run: npm run test:visual
      - name: Upload mobile visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worldstage-mobile-v2-evidence
          path: artifacts/mobile-v2/*
          if-no-files-found: error
          retention-days: 14
      - name: Preserve visual review PDF on branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/redesign/mobile-first-v2'
        run: |
          mkdir -p docs/worldstage/evidence
          cp artifacts/mobile-v2/WORLDSTAGE_MOBILE_V2_VISUAL_EVIDENCE.pdf docs/worldstage/evidence/WORLDSTAGE_MOBILE_V2_VISUAL_EVIDENCE.pdf
          git config user.name "worldstage-ci"
          git config user.email "actions@users.noreply.github.com"
          git add docs/worldstage/evidence/WORLDSTAGE_MOBILE_V2_VISUAL_EVIDENCE.pdf
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: preserve mobile v2 visual evidence [skip ci]"
          git push origin HEAD:redesign/mobile-first-v2
