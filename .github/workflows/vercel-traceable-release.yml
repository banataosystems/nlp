name: WorldStage traceable Vercel release

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact branch, tag, or commit SHA to test and deploy. Leave blank to use the workflow ref.
        required: false
        type: string
      target:
        description: Deployment target
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      confirm_production:
        description: For production only, type DEPLOY_CHERRY_PRODUCTION exactly. Leave blank for preview.
        required: false
        type: string
      prior_evidence_run_id:
        description: Prior same-repository successful run containing production-evidence inputs. Required only for production.
        required: false
        type: string
      prior_evidence_artifact_name:
        description: Exact production-evidence artifact name from the prior run. Required only for production.
        required: false
        type: string
      verified_preview_deployment_id:
        description: Exact candidate preview/staging deployment verified by upstream evidence. Required only for production.
        required: false
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  VERCEL_ORG_ID: team_IcdJUnzLi5wUN1GD8ALHyjF7
  VERCEL_PROJECT_ID: prj_ebP53cux8LAB18VFiKlgfP3ew2RH
  VERCEL_CLI_VERSION: 58.1.0
  WORLDSTAGE_RELEASE_CONTROL_DIR: artifacts/release-control
  WORLDSTAGE_EVIDENCE_DIR: artifacts/release-control/upstream

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate release intent
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
          PRIOR_EVIDENCE_RUN_ID: ${{ inputs.prior_evidence_run_id }}
          PRIOR_EVIDENCE_ARTIFACT_NAME: ${{ inputs.prior_evidence_artifact_name }}
          VERIFIED_PREVIEW_DEPLOYMENT_ID: ${{ inputs.verified_preview_deployment_id }}
        run: |
          set -euo pipefail
          if [[ "$TARGET" == "production" ]]; then
            if [[ "$CONFIRM_PRODUCTION" != "DEPLOY_CHERRY_PRODUCTION" ]]; then
              echo "Production release denied: exact confirmation string was not supplied." >&2
              exit 1
            fi
            if [[ ! "$PRIOR_EVIDENCE_RUN_ID" =~ ^[0-9]+$ ]]; then
              echo "Production release denied: numeric prior evidence run ID is required." >&2
              exit 1
            fi
            if [[ -z "$PRIOR_EVIDENCE_ARTIFACT_NAME" || -z "$VERIFIED_PREVIEW_DEPLOYMENT_ID" ]]; then
              echo "Production release denied: prior evidence artifact and verified preview deployment are required." >&2
              exit 1
            fi
          fi
          if [[ "$TARGET" != "preview" && "$TARGET" != "production" ]]; then
            echo "Unsupported deployment target: $TARGET" >&2
            exit 1
          fi

      - name: Checkout exact requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref != '' && inputs.release_ref || github.sha }}
          fetch-depth: 1

      - name: Capture exact source identity
        id: source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          SOURCE_TREE="$(git rev-parse HEAD^{tree})"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "tree=$SOURCE_TREE" >> "$GITHUB_OUTPUT"
          {
            echo "## WorldStage release candidate"
            echo ""
            echo "- Source SHA: \`$SOURCE_SHA\`"
            echo "- Source tree: \`$SOURCE_TREE\`"
            echo "- Requested target: \`${{ inputs.target }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify reviewed PR and exact-source CI provenance
        if: inputs.target == 'production'
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        with:
          script: |
            const sourceSha = process.env.SOURCE_SHA;
            const { owner, repo } = context.repo;
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner, repo, commit_sha: sourceSha,
            });
            const merged = prs.filter(pr => pr.merged_at && pr.base?.ref === 'main');
            if (merged.length === 0) {
              core.setFailed('Production release denied: exact source is not traceable to a merged PR targeting main.');
              return;
            }
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner, repo, head_sha: sourceSha, event: 'pull_request', per_page: 100,
            });
            const exactSuccess = data.workflow_runs.filter(run =>
              run.head_sha === sourceSha &&
              run.event === 'pull_request' &&
              run.conclusion === 'success' &&
              run.path === '.github/workflows/mobile-contract.yml'
            );
            if (exactSuccess.length === 0) {
              core.setFailed('Production release denied: exact source has no successful mandatory PR CI run.');
              return;
            }
            core.summary
              .addRaw(`- Reviewed PR provenance: #${merged.map(pr => pr.number).join(', #')}\n`)
              .addRaw(`- Exact-source mandatory CI: ${exactSuccess.map(run => run.id).join(', ')}\n`);
            await core.summary.write();

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download prior production evidence inputs
        if: inputs.target == 'production'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.prior_evidence_run_id }}
          name: ${{ inputs.prior_evidence_artifact_name }}
          path: artifacts/release-control/upstream

      - name: Assemble production evidence artifact
        if: inputs.target == 'production'
        env:
          WORLDSTAGE_SOURCE_SHA: ${{ steps.source.outputs.sha }}
          WORLDSTAGE_PRIOR_EVIDENCE_RUN_ID: ${{ inputs.prior_evidence_run_id }}
          WORLDSTAGE_PRIOR_EVIDENCE_ARTIFACT_NAME: ${{ inputs.prior_evidence_artifact_name }}
          WORLDSTAGE_VERIFIED_PREVIEW_DEPLOYMENT_ID: ${{ inputs.verified_preview_deployment_id }}
        run: node scripts/worldstage-production-evidence-artifact.mjs

      - name: Verify production evidence bundle with adapter
        if: inputs.target == 'production'
        run: node scripts/worldstage-production-evidence-verification-adapter.mjs --require-verified

      - name: Consume verified production evidence for release gate
        if: inputs.target == 'production'
        env:
          WORLDSTAGE_SOURCE_SHA: ${{ steps.source.outputs.sha }}
          WORLDSTAGE_PRIOR_EVIDENCE_RUN_ID: ${{ inputs.prior_evidence_run_id }}
          WORLDSTAGE_PRIOR_EVIDENCE_ARTIFACT_NAME: ${{ inputs.prior_evidence_artifact_name }}
          WORLDSTAGE_VERIFIED_PREVIEW_DEPLOYMENT_ID: ${{ inputs.verified_preview_deployment_id }}
          WORLDSTAGE_ADAPTER_MAX_AGE_SECONDS: "600"
        run: node scripts/worldstage-production-gate-consumption.mjs --require-consumed

      - name: Run machine-readable production release gate
        if: inputs.target == 'production'
        env:
          WORLDSTAGE_SOURCE_SHA: ${{ steps.source.outputs.sha }}
          WORLDSTAGE_PRIOR_EVIDENCE_RUN_ID: ${{ inputs.prior_evidence_run_id }}
          WORLDSTAGE_PRIOR_EVIDENCE_ARTIFACT_NAME: ${{ inputs.prior_evidence_artifact_name }}
          WORLDSTAGE_VERIFIED_PREVIEW_DEPLOYMENT_ID: ${{ inputs.verified_preview_deployment_id }}
        run: node scripts/worldstage-production-release-gate.mjs --require-ready --consumed-evidence artifacts/release-control/consumed-adapter-evidence.json

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Start static test server
        run: npx http-server . -p 4173 -c-1 > /tmp/worldstage-http.log 2>&1 &

      - name: Wait for test server
        run: npx wait-on http://127.0.0.1:4173

      - name: Run six-width mobile contract
        run: npm run test:mobile

      - name: Run iPhone WebKit and Pixel Chromium device-class contracts
        run: npm run test:devices

      - name: Run Discovery contract
        run: npm run test:phase3

      - name: Run Cherry OS contract
        run: npm run test:phase4

      - name: Run Transformation Record contract
        run: npm run test:phase5

      - name: Run release security and privacy contract
        run: npm run test:release

      - name: Generate exact-source visual evidence
        run: npm run test:visual

      - name: Upload pre-release visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: worldstage-release-${{ steps.source.outputs.sha }}
          path: artifacts/mobile-v2/*
          if-no-files-found: error
          retention-days: 30

      - name: Verify Vercel credential is configured
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo "Release denied: GitHub secret VERCEL_TOKEN is not configured for this repository/environment." >&2
            exit 1
          fi

      - name: Verify pinned Vercel CLI version
        id: vercel
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(npx --yes vercel@${VERCEL_CLI_VERSION} --version | tail -n 1)"
          if [[ "$VERSION" != *"${VERCEL_CLI_VERSION}"* ]]; then
            echo "Unexpected Vercel CLI version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "- Vercel CLI: \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Pull Vercel project configuration
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          npx --yes vercel@${VERCEL_CLI_VERSION} pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"

      - name: Build exact source for Vercel
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [[ "$TARGET" == "production" ]]; then
            npx --yes vercel@${VERCEL_CLI_VERSION} build --prod --token="$VERCEL_TOKEN"
          else
            npx --yes vercel@${VERCEL_CLI_VERSION} build --token="$VERCEL_TOKEN"
          fi

      - name: Deploy prebuilt artifact
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [[ "$TARGET" == "production" ]]; then
            DEPLOYMENT_URL="$(npx --yes vercel@${VERCEL_CLI_VERSION} deploy --prebuilt --prod --token="$VERCEL_TOKEN" | tail -n 1)"
          else
            DEPLOYMENT_URL="$(npx --yes vercel@${VERCEL_CLI_VERSION} deploy --prebuilt --token="$VERCEL_TOKEN" | tail -n 1)"
          fi
          if [[ "$DEPLOYMENT_URL" != https://* ]]; then
            echo "Vercel did not return an HTTPS deployment URL." >&2
            exit 1
          fi
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          {
            echo "- Deployment URL: $DEPLOYMENT_URL"
            echo "- Deployment target: \`$TARGET\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke deployed application through authenticated Vercel CLI
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          npx --yes vercel@${VERCEL_CLI_VERSION} curl / --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN" > /tmp/worldstage-root.html
          npx --yes vercel@${VERCEL_CLI_VERSION} curl /src/app.js --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN" > /tmp/worldstage-app.js
          test -s /tmp/worldstage-root.html
          test -s /tmp/worldstage-app.js
          grep -q "const ROUTES" /tmp/worldstage-app.js
          echo "- Deployment smoke: PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Write release provenance record
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_TREE: ${{ steps.source.outputs.tree }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          TARGET: ${{ inputs.target }}
          VERCEL_CLI_ACTUAL: ${{ steps.vercel.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/release
          cat > artifacts/release/release-provenance.txt <<EOR
          project=worldstage-cherry
          repository=banataosystems/nlp
          source_sha=$SOURCE_SHA
          source_tree=$SOURCE_TREE
          target=$TARGET
          deployment_url=$DEPLOYMENT_URL
          vercel_project_id=$VERCEL_PROJECT_ID
          vercel_org_id=$VERCEL_ORG_ID
          vercel_cli_requested=$VERCEL_CLI_VERSION
          vercel_cli_actual=$VERCEL_CLI_ACTUAL
          workflow_run_id=$GITHUB_RUN_ID
          workflow_run_attempt=$GITHUB_RUN_ATTEMPT
          EOR
          cat artifacts/release/release-provenance.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release provenance
        uses: actions/upload-artifact@v4
        with:
          name: worldstage-release-provenance-${{ steps.source.outputs.sha }}
          path: artifacts/release/release-provenance.txt
          if-no-files-found: error
          retention-days: 90
